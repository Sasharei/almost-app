appId: com.sasarei.almostclean
name: Deny notification and retain pause
---
- tapOn: Don’t allow
- tapOn: Pause
- assertVisible: Coffee to-go|Coffee and pastry combo
- takeScreenshot: pause-after-deny
- stopApp
- launchApp:
    permissions:
      notifications: deny
- tapOn: Pause
- assertVisible: Coffee to-go|Coffee and pastry combo
- takeScreenshot: pause-restart
