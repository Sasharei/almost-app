appId: com.sasarei.almostclean
name: Arabic Russian English state recovery
---
- takeScreenshot: arabic-profile
- scrollUntilVisible:
    element:
      id: settings-language
    direction: UP
    visibilityPercentage: 100
- tapOn:
    id: settings-language
- scrollUntilVisible:
    element:
      id: settings-choice-ru
    direction: UP
    visibilityPercentage: 100
- tapOn:
    id: settings-choice-ru
- waitForAnimationToEnd
- takeScreenshot: russian-state
- tapOn:
    id: settings-language
- scrollUntilVisible:
    element:
      id: settings-choice-en
    direction: UP
    visibilityPercentage: 100
- tapOn:
    id: settings-choice-en
- waitForAnimationToEnd
- takeScreenshot: english-recovered
