# iPhone17/iOS26.5. Starts in full-app Settings, English locale.
# Opens Reminders but explicitly discards the unsaved synthetic draft.
appId: com.sasarei.almostclean
---
- scrollUntilVisible:
    element:
      id: request-cloud-deletion
    direction: DOWN
- tapOn:
    id: request-cloud-deletion
- tapOn:
    id: cloud-deletion-share
- assertVisible: Reminders
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    point: "17%,74%"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: native-extension-editor
- tapOn:
    point: "9%,13%"
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    point: "32%,23%"
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible: Copy
- tapOn:
    point: "17%,89%"
- waitForAnimationToEnd:
    timeout: 10000
- assertVisible:
    id: request-cloud-deletion
- scrollUntilVisible:
    element:
      id: settings-language
    direction: UP
- tapOn:
    id: settings-language
- assertVisible:
    id: settings-choice-en
- takeScreenshot: native-extension-return-scroll
