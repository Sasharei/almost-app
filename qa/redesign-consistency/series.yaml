appId: com.sasarei.almostclean
name: Series reward and restart
# Run seed-series.py first. A ready series opens its ritual automatically.
---
- extendedWaitUntil:
    visible: Open chest
    timeout: 60000
- takeScreenshot: series-ready
- repeat:
    times: 4
    commands:
      - tapOn: Open chest
- extendedWaitUntil:
    visible: Chest opened
    timeout: 15000
- takeScreenshot: chest-opened
- tapOn: Ok
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: series-complete
- tapOn:
    text: Continue
    index: 1
- tapOn:
    text: Later
    optional: true
- assertVisible: Choose what to spend and what to save.
- takeScreenshot: series-return-today
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: header-help
    timeout: 60000
- takeScreenshot: series-relaunch
