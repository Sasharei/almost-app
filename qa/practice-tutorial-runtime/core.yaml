appId: com.sasarei.almostclean
---
- extendedWaitUntil:
    visible: 'Try it with your purchase'
    timeout: 90000
- runFlow:
    when:
      visible: '.*Error reading persisted.*'
    commands:
      - tapOn:
          point: 92%,93%
- runFlow:
    when:
      visible: '.*Error fetching offerings.*'
    commands:
      - tapOn:
          point: 92%,93%
- runFlow:
    when:
      visible: 'Open debugger to view warnings.'
    commands:
      - tapOn:
          point: 92%,86%
- takeScreenshot: open
- tapOn:
    id: today-make-decision
- assertVisible: 'Choose a purchase'
- takeScreenshot: card
- tapOn: 'QA Coffee,.*'
- assertVisible: 'Check the price'
- takeScreenshot: amount
- tapOn:
    id: decision-amount-input
- takeScreenshot: keyboard
- eraseText
- inputText: '7'
- tapOn:
    id: decision-amount-done
- assertVisible: 'What happened to the purchase\?'
- takeScreenshot: action
- tapOn:
    id: decision-spend
- takeScreenshot: confirmation
