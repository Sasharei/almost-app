appId: com.sasarei.almostclean.settingsqa
---
- launchApp
- extendedWaitUntil:
    visible:
      id: qa-result
    timeout: 60000
- tapOn:
    id: qa-accents
- assertVisible:
    id: pro-accent-scroll
- takeScreenshot: accents-top
- scrollUntilVisible:
    element:
      text: '.*Аква.*'
    direction: DOWN
    centerElement: true
- takeScreenshot: accents-bottom
- scrollUntilVisible:
    element:
      text: '[оОoO][кКkK]'
    direction: DOWN
- tapOn: '[оОoO][кКkK]'
- assertNotVisible:
    id: pro-accent-scroll
- scrollUntilVisible:
    element:
      id: profile-row-redesignProfileSettings
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: profile-row-redesignProfileSettings
- runFlow:
    when:
      visible:
        id: profile-row-redesignProfileSettings
    commands:
      - tapOn:
          id: profile-row-redesignProfileSettings
- tapOn:
    id: settings-currency
- takeScreenshot: currency-top
- scrollUntilVisible:
    element:
      id: settings-choice-UZS
    direction: DOWN
- takeScreenshot: currency-bottom
- tapOn:
    id: settings-back
- scrollUntilVisible:
    element:
      id: settings-help
    direction: DOWN
    centerElement: true
- tapOn:
    id: settings-help
- takeScreenshot: help-guide
- tapOn:
    id: help-replay-practice
- scrollUntilVisible:
    element:
      id: settings-report-bug
    direction: DOWN
    centerElement: true
- tapOn:
    id: settings-report-bug
- takeScreenshot: bug-report
- tapOn: 'Отмена'
