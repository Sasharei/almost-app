appId: com.sasarei.almostclean.settingsqa
---
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible:
      id: qa-state
    timeout: 60000
- openLink: almostsettingsqa://preview?theme=light&accent=indigo&lang=ru&premium=1
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible:
      text: light:indigo:ru
    timeout: 10000
- waitForAnimationToEnd: {}
- takeScreenshot: settings-top-light
- tapOn:
    id: settings-theme
- assertVisible:
    id: settings-choice-light
- takeScreenshot: theme-light
- tapOn:
    id: settings-back
- scrollUntilVisible:
    element:
      id: settings-expenses
    direction: DOWN
    centerElement: true
    waitToSettleTimeoutMs: 1000
- takeScreenshot: settings-personal-light
