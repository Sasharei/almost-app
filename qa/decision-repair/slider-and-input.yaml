appId: com.sasarei.almostclean
---
- tapOn: '.*QA Coffee.*'
- tapOn:
    point: 92%,93%
- tapOn:
    point: 92%,93%
- waitForAnimationToEnd
- takeScreenshot: coffee-selected-clean
- swipe:
    start: 50%,60%
    end: 85%,25%
    duration: 2000
- assertVisible:
    id: decision-amount-input
    text: "22"
- takeScreenshot: slider-outside-up
- swipe:
    start: 85%,60%
    end: 15%,83%
    duration: 2000
- assertVisible:
    id: decision-amount-input
    text: "2"
- takeScreenshot: slider-outside-down
- tapOn:
    id: decision-amount-input
- eraseText
- inputText: '17.5'
- tapOn:
    id: decision-amount-done
- assertVisible:
    id: decision-amount-input
    text: "17.5"
