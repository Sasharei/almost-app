appId: com.sasarei.almostclean
---
- extendedWaitUntil:
    visible: "Make a decision|OK"
    timeout: 60000
- runFlow:
    when:
      visible: "Missing.*EXPO_PUBLIC_RC.*"
    commands:
      - tapOn: OK
- takeScreenshot: today
- tapOn:
    id: today-make-decision
- assertVisible:
    id: decision-card-wheel
- takeScreenshot: wheel
- tapOn: Pause
- assertVisible: ".*QA Pause Timer.*"
- takeScreenshot: pause
- tapOn: Profile
- assertVisible: ".*QA Tester.*"
- takeScreenshot: profile
- scrollUntilVisible:
    element:
      text: ".*Settings.*"
    direction: DOWN
    visibilityPercentage: 100
- tapOn: ".*Settings.*"
- assertVisible: App sounds
- takeScreenshot: settings
- assertNotVisible: Open All Settings
- scrollUntilVisible:
    element:
      text: ".*Categories.*"
    direction: DOWN
    visibilityPercentage: 100
- tapOn: ".*Categories.*"
- assertVisible: Add category
- takeScreenshot: categories
- tapOn: Add category
- assertVisible: New category
- takeScreenshot: new-category
- tapOn: Cancel
- tapOn: Done
- tapOn: Progress
- tapOn:
    text: Got it
    optional: true
- scrollUntilVisible:
    element:
      text: Subscription watch
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
- takeScreenshot: subscription-widget
- tapOn: Subscription watch
- assertVisible: Subscriptions
- takeScreenshot: subscription-details
