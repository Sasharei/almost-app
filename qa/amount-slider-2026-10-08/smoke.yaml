- takeScreenshot: autocollect-pro-sunset
- tapOn: 'Закрыть без подтверждения'
- tapOn:
    id: qa-gold
- takeScreenshot: slider-pro-gold
- tapOn:
    id: qa-autosave
- takeScreenshot: autocollect-pro-gold
- tapOn: 'Закрыть без подтверждения'
- tapOn:
    id: qa-violet
- takeScreenshot: slider-pro-violet
- tapOn:
    id: qa-autosave
- takeScreenshot: autocollect-pro-violet
- tapOn: 'Закрыть без подтверждения'
