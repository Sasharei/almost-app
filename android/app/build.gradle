import com.android.build.api.instrumentation.AsmClassVisitorFactory
import com.android.build.api.instrumentation.ClassContext
import com.android.build.api.instrumentation.ClassData
import com.android.build.api.instrumentation.FramesComputationMode
import com.android.build.api.instrumentation.InstrumentationParameters
import com.android.build.api.instrumentation.InstrumentationScope
import org.objectweb.asm.ClassVisitor
import org.objectweb.asm.Label
import org.objectweb.asm.MethodVisitor
import org.objectweb.asm.Opcodes

abstract class ReactModalHostStabilityVisitorFactory
        implements AsmClassVisitorFactory<InstrumentationParameters.None> {
    private static final String TARGET_CLASS =
        "com.facebook.react.views.modal.ReactModalHostView"
    private static final String TARGET_INTERNAL_NAME =
        "com/facebook/react/views/modal/ReactModalHostView"
    private static final String EDGE_TO_EDGE_FLAG_OWNER =
        "com/facebook/react/views/view/WindowUtilKt"
    private static final String STATUS_BAR_HEIGHT_SETTER =
        'access$setStatusBarHeight$cp'
    private static final Map<String, Map<String, String>> GUARDED_SETTERS = [
        setStatusBarTranslucent: [
            field: "statusBarTranslucent",
            argument: "Z",
        ],
        setNavigationBarTranslucent: [
            field: "navigationBarTranslucent",
            argument: "Z",
        ],
        setAnimationType: [
            field: "animationType",
            argument: "Ljava/lang/String;",
        ],
        setHardwareAccelerated: [
            field: "hardwareAccelerated",
            argument: "Z",
        ],
    ]

    @Override
    boolean isInstrumentable(ClassData classData) {
        return classData.className == TARGET_CLASS
    }

    @Override
    ClassVisitor createClassVisitor(
            ClassContext classContext,
            ClassVisitor nextClassVisitor
    ) {
        return new ClassVisitor(Opcodes.ASM9, nextClassVisitor) {
            @Override
            MethodVisitor visitMethod(
                    int access,
                    String name,
                    String descriptor,
                    String signature,
                    String[] exceptions
            ) {
                MethodVisitor nextMethodVisitor = super.visitMethod(
                    access,
                    name,
                    descriptor,
                    signature,
                    exceptions
                )
                if (name == STATUS_BAR_HEIGHT_SETTER && descriptor == "(I)V") {
                    return new MethodVisitor(Opcodes.ASM9, nextMethodVisitor) {
                        @Override
                        void visitCode() {
                            super.visitCode()
                            Label keepLegacyInset = new Label()
                            mv.visitMethodInsn(
                                Opcodes.INVOKESTATIC,
                                EDGE_TO_EDGE_FLAG_OWNER,
                                "isEdgeToEdgeFeatureFlagOn",
                                "()Z",
                                false
                            )
                            mv.visitJumpInsn(Opcodes.IFEQ, keepLegacyInset)
                            mv.visitInsn(Opcodes.ICONST_0)
                            mv.visitVarInsn(Opcodes.ISTORE, 0)
                            mv.visitLabel(keepLegacyInset)
                        }
                    }
                }
                Map<String, String> guardedSetter = GUARDED_SETTERS[name]
                if (
                    guardedSetter == null ||
                    descriptor != "(${guardedSetter.argument})V"
                ) {
                    return nextMethodVisitor
                }
                String fieldName = guardedSetter.field
                String argumentDescriptor = guardedSetter.argument
                return new MethodVisitor(Opcodes.ASM9, nextMethodVisitor) {
                    @Override
                    void visitCode() {
                        super.visitCode()
                        Label valueChanged = new Label()
                        if (argumentDescriptor == "Z") {
                            mv.visitVarInsn(Opcodes.ALOAD, 0)
                            mv.visitFieldInsn(
                                Opcodes.GETFIELD,
                                TARGET_INTERNAL_NAME,
                                fieldName,
                                argumentDescriptor
                            )
                            mv.visitVarInsn(Opcodes.ILOAD, 1)
                            mv.visitJumpInsn(Opcodes.IF_ICMPNE, valueChanged)
                        } else {
                            mv.visitVarInsn(Opcodes.ALOAD, 0)
                            mv.visitFieldInsn(
                                Opcodes.GETFIELD,
                                TARGET_INTERNAL_NAME,
                                fieldName,
                                argumentDescriptor
                            )
                            mv.visitVarInsn(Opcodes.ALOAD, 1)
                            mv.visitMethodInsn(
                                Opcodes.INVOKESTATIC,
                                "java/util/Objects",
                                "equals",
                                "(Ljava/lang/Object;Ljava/lang/Object;)Z",
                                false
                            )
                            mv.visitJumpInsn(Opcodes.IFEQ, valueChanged)
                        }
                        mv.visitInsn(Opcodes.RETURN)
                        mv.visitLabel(valueChanged)
                    }
                }
            }
        }
    }
}

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.crashlytics"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

def facebookProperties = new Properties()
def facebookPropertiesFile = new File(projectRoot, "facebook.properties")
if (facebookPropertiesFile.exists()) {
    facebookProperties.load(new FileInputStream(facebookPropertiesFile))
}
def firstNonEmpty = { List<String> values ->
    values.find { it != null && it.toString().trim() }?.toString()?.trim()
}
def facebookAppId = firstNonEmpty([
    facebookProperties.getProperty("facebookAppId"),
    System.getenv("FACEBOOK_APP_ID"),
    "1653035139013896",
]) ?: ""
def facebookClientToken = firstNonEmpty([
    facebookProperties.getProperty("facebookClientToken"),
    System.getenv("FACEBOOK_CLIENT_TOKEN"),
    "c17d5adb7d4e8b7a284ea24dc4d4542f",
]) ?: ""
def facebookDisplayName = firstNonEmpty([
    facebookProperties.getProperty("facebookDisplayName"),
    System.getenv("FACEBOOK_DISPLAY_NAME"),
    "Almost",
]) ?: "Almost"
def facebookSdkVersion = rootProject.ext.has("facebookSdkVersion")
    ? rootProject.ext.get("facebookSdkVersion")
    : "18.+"
def nodeBinary = System.getenv("NODE_BINARY")
if (nodeBinary == null || nodeBinary.trim().isEmpty()) {
    nodeBinary = new File("/usr/local/bin/node").exists() ? "/usr/local/bin/node" : "node"
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file([nodeBinary, "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File([nodeBinary, "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File([nodeBinary, "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File([nodeBinary, "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File([nodeBinary, "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    nodeExecutableAndArgs = [nodeBinary]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def releaseStoreFile = keystoreProperties.getProperty("storeFile") ?: System.getenv("ANDROID_STORE_FILE")
def releaseStorePassword = keystoreProperties.getProperty("storePassword") ?: System.getenv("ANDROID_STORE_PASSWORD")
def releaseKeyAlias = keystoreProperties.getProperty("keyAlias") ?: System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = keystoreProperties.getProperty("keyPassword") ?: System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseKeystore = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.sasarei.almostclean"
    defaultConfig {
        applicationId "com.sasarei.almostclean"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 119
        versionName "7.1.0"

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
        resValue "string", "facebook_app_id", facebookAppId
        resValue "string", "facebook_client_token", facebookClientToken
        resValue "string", "facebook_display_name", facebookDisplayName
        if (facebookAppId) {
            resValue "string", "fb_login_protocol_scheme", "fb${facebookAppId}"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseKeystore) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                throw new GradleException("Release keystore not configured. Provide keystore.properties or ANDROID_* env vars.")
            }
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.instrumentation.transformClassesWith(
            ReactModalHostStabilityVisitorFactory.class,
            InstrumentationScope.ALL
        ) {}
        variant.instrumentation.setAsmFramesComputationMode(
            FramesComputationMode.COMPUTE_FRAMES_FOR_INSTRUMENTED_METHODS
        )
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.android:facebook-android-sdk:${facebookSdkVersion}")
    implementation("com.android.billingclient:billing:8.3.0")
    implementation(platform("com.google.firebase:firebase-bom:34.8.0"))
    implementation("com.google.firebase:firebase-crashlytics")
    implementation("com.google.firebase:firebase-analytics")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// AGP native clean can fail when cached prefab transform paths disappear between runs.
// We skip fragile externalNativeBuildClean* tasks and remove CMake intermediates directly.
tasks.matching { task -> task.name.startsWith("externalNativeBuildClean") }.configureEach {
    enabled = false
}

tasks.named("clean").configure {
    doFirst {
        delete file("${projectDir}/.cxx")
    }
}
