appId: com.sasarei.almostclean
---
- inputText: '12.34'
- tapOn: I decided not to buy
- extendedWaitUntil:
    visible: Almost Pay
    timeout: 15000
- assertVisible: '.*12.34.*'
- assertVisible: Simulated confirmation. No money is charged.
- waitForAnimationToEnd
- takeScreenshot: almost-pay-save
- tapOn:
    id: almost-pay-confirm
- assertVisible: Press again to confirm
- takeScreenshot: almost-pay-ready
- tapOn:
    id: almost-pay-cancel
- extendedWaitUntil:
    visible:
      id: decision-amount-input
    timeout: 10000
- assertVisible: '12.34'
- waitForAnimationToEnd
- takeScreenshot: cancelled-decision
- tapOn: I decided not to buy
- assertVisible: Almost Pay
- tapOn:
    id: almost-pay-confirm
- tapOn:
    id: almost-pay-confirm
- extendedWaitUntil:
    notVisible: Almost Pay
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: saved-result
